<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cloud Browser Desktop</title>
<!-- Entry point for GET / (also Render's health check, which needs a 200).
     Sends the browser straight to the noVNC client: autoconnect on,
     desktop scaled to fit the window, auto-reconnect if the socket drops.
     The client will ask for the VNC password (from Render Environment). -->
<meta http-equiv="refresh" content="0; url=vnc.html?autoconnect=true&amp;resize=scale&amp;reconnect=true">
</head>
<body>
<p>Opening the real Chrome desktop…</p>
<p><a href="vnc.html?autoconnect=true&amp;resize=scale&amp;reconnect=true">Click here if you are not redirected automatically.</a></p>
</body>
</html>
